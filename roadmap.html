
<h2 class="sr-only">Lộ trình nghiên cứu phát hiện mơ hồ trong SRS từ Planning đến Maintenance</h2>
<style>
  .phase-nav { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:20px; }
  .pnav-btn { padding:6px 14px; border-radius:20px; border:0.5px solid var(--color-border-secondary); background:transparent; color:var(--color-text-secondary); font-size:13px; cursor:pointer; transition:all .15s; }
  .pnav-btn.active { background:var(--color-background-info); color:var(--color-text-info); border-color:transparent; font-weight:500; }
  .phase-panel { display:none; }
  .phase-panel.active { display:block; }
  .phase-header { display:flex; align-items:center; gap:12px; margin-bottom:16px; padding-bottom:12px; border-bottom:0.5px solid var(--color-border-tertiary); }
  .phase-badge { padding:4px 12px; border-radius:20px; font-size:12px; font-weight:500; }
  .phase-title { font-size:17px; font-weight:500; color:var(--color-text-primary); margin:0; }
  .phase-sub { font-size:13px; color:var(--color-text-secondary); margin:4px 0 0; }
  .step-list { display:flex; flex-direction:column; gap:10px; }
  .step-card { background:var(--color-background-secondary); border-radius:var(--border-radius-md); padding:12px 14px; }
  .step-title { font-size:14px; font-weight:500; color:var(--color-text-primary); margin:0 0 4px; }
  .step-desc { font-size:13px; color:var(--color-text-secondary); margin:0; line-height:1.6; }
  .step-code { font-family:var(--font-mono); font-size:12px; background:var(--color-background-primary); border:0.5px solid var(--color-border-tertiary); border-radius:6px; padding:8px 10px; margin-top:8px; color:var(--color-text-secondary); white-space:pre; overflow-x:auto; }
  .tag-row { display:flex; gap:6px; flex-wrap:wrap; margin-top:8px; }
  .tag { font-size:11px; padding:2px 8px; border-radius:12px; font-weight:500; }
  .tag-blue { background:var(--color-background-info); color:var(--color-text-info); }
  .tag-amber { background:var(--color-background-warning); color:var(--color-text-warning); }
  .tag-green { background:var(--color-background-success); color:var(--color-text-success); }
  .tag-red { background:var(--color-background-danger); color:var(--color-text-danger); }
  .two-col { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .metric-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:10px; }
  .metric-box { background:var(--color-background-primary); border:0.5px solid var(--color-border-tertiary); border-radius:var(--border-radius-md); padding:10px; text-align:center; }
  .metric-val { font-size:18px; font-weight:500; color:var(--color-text-primary); }
  .metric-lbl { font-size:11px; color:var(--color-text-secondary); margin-top:2px; }
  .ask-btn { margin-top:14px; padding:8px 16px; border-radius:var(--border-radius-md); border:0.5px solid var(--color-border-secondary); background:transparent; color:var(--color-text-secondary); font-size:13px; cursor:pointer; }
  .ask-btn:hover { background:var(--color-background-secondary); }
  @media(max-width:500px){ .two-col{grid-template-columns:1fr;} .metric-grid{grid-template-columns:1fr 1fr;} }
</style>

<div class="phase-nav" id="nav"></div>
<div id="panels"></div>

<script>
const phases = [
  {
    id:'planning', label:'1. Planning', duration:'2–4 tuần',
    badgeCls:'tag-blue', badgeText:'Nền tảng',
    title:'Research planning & scope definition',
    sub:'Xác định phạm vi, thu thập tài liệu, thiết kế annotation schema',
    steps:[
      {
        title:'Xác định loại mơ hồ cần phát hiện',
        desc:'Dựa trên IEEE 830 và tài liệu RE, chọn taxonomy: Lexical, Syntactic, Semantic, Referential, Incompleteness.',
        tags:[{t:'IEEE 830',c:'tag-blue'},{t:'Taxonomy',c:'tag-blue'}]
      },
      {
        title:'Thu thập corpus SRS + hình ảnh',
        desc:'Tìm kiếm SRS mã nguồn mở (PROMISE repo, GitHub), bổ sung tài liệu từ đối tác. Mục tiêu: 200+ tài liệu SRS, 500+ hình ảnh requirement sketch.',
        tags:[{t:'PROMISE repo',c:'tag-amber'},{t:'Min 200 docs',c:'tag-amber'}]
      },
      {
        title:'Thiết kế annotation schema',
        desc:'Định nghĩa format nhãn: span vị trí + loại mơ hồ + mức độ (high/medium/low) + giải thích. Dùng BRAT hoặc Label Studio.',
        code:'{"text": "The system shall respond quickly.",\n "span": [25, 32], "type": "lexical",\n "severity": "high", "reason": "vague quantifier"}',
        tags:[{t:'BRAT / LabelStudio',c:'tag-blue'},{t:'IAA > 0.7',c:'tag-green'}]
      },
      {
        title:'Xây dựng từ điển mơ hồ (Rule lexicon)',
        desc:'Thu thập từ vựng từ: Checklists RE (Rupp, Femmer), nghiên cứu NLP trước, domain-specific SRS. Phân loại theo type.',
        tags:[{t:'~500 từ/cụm',c:'tag-amber'},{t:'Có trọng số',c:'tag-blue'}]
      }
    ],
    ask:'Hướng dẫn chi tiết cách xây dựng từ điển mơ hồ'
  },
  {
    id:'data', label:'2. Data', duration:'4–6 tuần',
    badgeCls:'tag-amber', badgeText:'Dữ liệu',
    title:'Data collection, annotation & augmentation',
    sub:'Annotation đa annotator, kiểm tra chất lượng, augment dữ liệu',
    steps:[
      {
        title:'Quy trình annotation 2 vòng',
        desc:'Vòng 1: 2 annotator độc lập gán nhãn. Vòng 2: Adjudication với annotator thứ 3 nếu IAA < 0.75. Đo Cohen Kappa sau mỗi batch 50 tài liệu.',
        tags:[{t:'Cohen Kappa',c:'tag-blue'},{t:'2 annotators',c:'tag-blue'}]
      },
      {
        title:'Ghép cặp text-image alignment',
        desc:'Với mỗi requirement có hình ảnh, tạo cặp (text_span, image_region) để train VLM. Dùng bounding box annotation cho vùng liên quan trong hình.',
        tags:[{t:'Multimodal pairs',c:'tag-green'},{t:'COCO format',c:'tag-blue'}]
      },
      {
        title:'Data augmentation',
        desc:'Paraphrase câu dùng back-translation (EN→VI→EN). Inject từ vựng mơ hồ vào câu rõ ràng để tạo negative samples. Tỷ lệ mục tiêu: 40% ambiguous / 60% non-ambiguous.',
        tags:[{t:'Back-translation',c:'tag-amber'},{t:'40/60 ratio',c:'tag-green'}]
      },
      {
        title:'Train/Val/Test split',
        desc:'80/10/10 theo tài liệu (không theo câu) để tránh data leakage. Test set nên bao gồm SRS từ domain chưa thấy.',
        code:'train: 160 docs (~3,200 sentences)\nval:   20 docs (~400 sentences)\ntest:  20 docs (unseen domains)',
        tags:[{t:'No leakage',c:'tag-red'},{t:'Unseen domain',c:'tag-red'}]
      }
    ],
    ask:'Cách tổ chức annotation pipeline với LabelStudio'
  },
  {
    id:'impl', label:'3. Implementation', duration:'6–8 tuần',
    badgeCls:'tag-blue', badgeText:'Kỹ thuật',
    title:'Model implementation & fine-tuning',
    sub:'Fine-tune Qwen 2.5, xây dựng rule engine, thiết kế fusion',
    steps:[
      {
        title:'Fine-tune Qwen 2.5 (LLM branch) với QLoRA',
        desc:'Dùng QLoRA 4-bit để giảm VRAM. Format dữ liệu theo Qwen chat template. Train SFT với SFTTrainer của thư viện trl.',
        code:'from trl import SFTTrainer\nfrom peft import LoraConfig\n\nlora_cfg = LoraConfig(\n  r=16, lora_alpha=32,\n  target_modules=["q_proj","v_proj"],\n  lora_dropout=0.05\n)',
        tags:[{t:'QLoRA 4-bit',c:'tag-blue'},{t:'trl + peft',c:'tag-blue'},{t:'VRAM ~16GB',c:'tag-amber'}]
      },
      {
        title:'Fine-tune Qwen2.5-VL (VLM branch)',
        desc:'Dùng Qwen2.5-VL-7B. Input: ảnh requirement + text SRS tương ứng. Output: nhãn mơ hồ + vị trí trong text. Freeze vision encoder 2 epoch đầu.',
        tags:[{t:'Qwen2.5-VL-7B',c:'tag-blue'},{t:'Freeze ViT',c:'tag-amber'},{t:'Image+text',c:'tag-green'}]
      },
      {
        title:'Rule-based engine',
        desc:'Xây dựng pipeline: tokenize → POS tag → lookup lexicon → apply pattern rules. Trả về list (span, type, confidence). Confidence = TF-IDF weight của từ trong lexicon.',
        code:'def rule_check(sentence):\n  tokens = nlp(sentence)\n  hits = []\n  for tok in tokens:\n    if tok.lemma_ in AMBIGUITY_LEXICON:\n      hits.append({\n        "span":[tok.idx, tok.idx+len(tok)],\n        "type": LEXICON[tok.lemma_]["type"],\n        "conf": LEXICON[tok.lemma_]["weight"]\n      })\n  return hits',
        tags:[{t:'spaCy',c:'tag-blue'},{t:'TF-IDF weight',c:'tag-blue'}]
      },
      {
        title:'Fusion module',
        desc:'Concatenate logits/embeddings từ 3 nguồn → MLP classifier 2 lớp. Có thể thêm learned attention weights để mỗi nguồn có trọng số động theo context. Train fusion riêng sau khi freeze 3 nhánh.',
        code:'class FusionModule(nn.Module):\n  def __init__(self):\n    self.attn = nn.Linear(3, 3)  # 3 sources\n    self.cls  = nn.Linear(hidden*3, num_classes)\n\n  def forward(self, llm, vlm, rule):\n    w = softmax(self.attn(ones(3)))\n    fused = cat([w[0]*llm, w[1]*vlm, w[2]*rule])\n    return self.cls(fused)',
        tags:[{t:'Learned weights',c:'tag-green'},{t:'Freeze branches',c:'tag-amber'}]
      }
    ],
    ask:'Viết code fine-tuning Qwen 2.5 với QLoRA hoàn chỉnh'
  },
  {
    id:'bench', label:'4. Benchmark', duration:'2–3 tuần',
    badgeCls:'tag-green', badgeText:'Đánh giá',
    title:'Benchmarking & ablation study',
    sub:'Đo lường toàn diện, so sánh baseline, phân tích lỗi',
    steps:[
      {
        title:'Metrics chính',
        desc:'Đo theo từng loại mơ hồ và tổng thể: Precision, Recall, F1-macro, F1-weighted. Với span detection: partial match IoU ≥ 0.5.',
        code:'',
        tags:[{t:'F1-macro',c:'tag-blue'},{t:'Span IoU ≥ 0.5',c:'tag-blue'},{t:'Per-type F1',c:'tag-blue'}],
        metrics:[{v:'F1',l:'Primary metric'},{v:'P/R',l:'Per class'},{v:'IoU',l:'Span match'}]
      },
      {
        title:'Ablation study (bắt buộc cho luận văn)',
        desc:'So sánh 7 cấu hình: (1) Rule only, (2) LLM only, (3) VLM only, (4) Rule+LLM, (5) Rule+VLM, (6) LLM+VLM, (7) Full system. Chứng minh từng thành phần đóng góp gì.',
        tags:[{t:'7 configurations',c:'tag-amber'},{t:'Statistical test',c:'tag-amber'}]
      },
      {
        title:'Baseline comparison',
        desc:'So sánh với: BERT-base-NLI (zero-shot), GPT-4o (few-shot prompting), công trình trước trong RE ambiguity (Femmer 2017, Yang 2022). Dùng McNemar test để kiểm định ý nghĩa thống kê.',
        tags:[{t:'GPT-4o baseline',c:'tag-red'},{t:'McNemar test',c:'tag-blue'}]
      },
      {
        title:'Error analysis & case study',
        desc:'Phân loại lỗi: False Positive (câu rõ nhưng bị flag), False Negative (câu mơ hồ bỏ sót), Wrong type. Chọn 30 case điển hình để phân tích định tính trong luận văn.',
        tags:[{t:'Qualitative analysis',c:'tag-green'},{t:'30 case study',c:'tag-green'}]
      }
    ],
    ask:'Thiết kế ablation study chi tiết cho luận văn'
  },
  {
    id:'maint', label:'5. Maintenance', duration:'Ongoing',
    badgeCls:'tag-green', badgeText:'Bền vững',
    title:'Deployment & maintenance strategy',
    sub:'Đưa vào production, monitoring, cập nhật mô hình',
    steps:[
      {
        title:'Packaging & API',
        desc:'Đóng gói thành REST API với FastAPI. Endpoint nhận SRS text/image, trả về JSON báo cáo mơ hồ. Containerize bằng Docker để dễ deploy.',
        code:'POST /analyze\nBody: {text: str, image?: base64}\nResponse: {\n  ambiguities: [\n    {span, type, severity,\n     explanation, suggestion}\n  ],\n  overall_score: float\n}',
        tags:[{t:'FastAPI',c:'tag-blue'},{t:'Docker',c:'tag-blue'}]
      },
      {
        title:'Monitoring & drift detection',
        desc:'Log tất cả prediction + confidence score. Theo dõi: distribution shift của input (SRS từ domain mới), performance degradation khi F1 trên monitoring set giảm > 5%.',
        tags:[{t:'Confidence tracking',c:'tag-amber'},{t:'Drift > 5%',c:'tag-red'}]
      },
      {
        title:'Cập nhật lexicon định kỳ',
        desc:'Rule-based lexicon cần review mỗi quý: thêm từ domain-specific từ feedback người dùng, loại bỏ false positive patterns. Phiên bản hóa lexicon theo semver.',
        tags:[{t:'Quarterly review',c:'tag-green'},{t:'Semver',c:'tag-blue'}]
      },
      {
        title:'Active learning loop',
        desc:'Với các sample mô hình không chắc (confidence < 0.6), gửi cho annotator review. Tái train mỗi khi tích lũy đủ 100 samples mới. Giảm dần chi phí annotation theo thời gian.',
        tags:[{t:'Conf < 0.6',c:'tag-amber'},{t:'100 samples/cycle',c:'tag-green'}]
      }
    ],
    ask:'Thiết kế hệ thống active learning cho mô hình này'
  }
];

const nav = document.getElementById('nav');
const panels = document.getElementById('panels');

phases.forEach((p, i) => {
  const btn = document.createElement('button');
  btn.className = 'pnav-btn' + (i===0?' active':'');
  btn.textContent = p.label;
  btn.onclick = () => {
    document.querySelectorAll('.pnav-btn').forEach(b=>b.classList.remove('active'));
    document.querySelectorAll('.phase-panel').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('panel-'+p.id).classList.add('active');
  };
  nav.appendChild(btn);

  const panel = document.createElement('div');
  panel.className = 'phase-panel' + (i===0?' active':'');
  panel.id = 'panel-'+p.id;

  const stepsHtml = p.steps.map(s => `
    <div class="step-card">
      <p class="step-title">${s.title}</p>
      <p class="step-desc">${s.desc}</p>
      ${s.code ? `<div class="step-code">${s.code}</div>` : ''}
      ${s.metrics ? `<div class="metric-grid">${s.metrics.map(m=>`<div class="metric-box"><div class="metric-val">${m.v}</div><div class="metric-lbl">${m.l}</div></div>`).join('')}</div>` : ''}
      <div class="tag-row">${s.tags.map(t=>`<span class="tag ${t.c}">${t.t}</span>`).join('')}</div>
    </div>
  `).join('');

  panel.innerHTML = `
    <div class="phase-header">
      <span class="tag ${p.badgeCls}" style="white-space:nowrap">${p.badgeText} · ${p.duration}</span>
      <div>
        <p class="phase-title">${p.title}</p>
        <p class="phase-sub">${p.sub}</p>
      </div>
    </div>
    <div class="step-list">${stepsHtml}</div>
    <button class="ask-btn" onclick="sendPrompt('${p.ask}')"><i class="ti ti-arrow-right" style="font-size:14px;margin-right:4px" aria-hidden="true"></i>${p.ask} ↗</button>
  `;
  panels.appendChild(panel);
});
</script>
